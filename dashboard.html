<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard HRIS | RSUD Drs. H. AMRI TAMBUNAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Style untuk readonly input agar terlihat berbeda */
        input[readonly] { background-color: #f9fafb; cursor: not-allowed; color: #6b7280; font-weight: 500; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800 antialiased">

    <!-- Sidebar (Opsional/Simulasi) -->
    <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col shadow-sm">
        <div class="p-6 flex justify-center border-b border-gray-100">
            <img src="HRIS.png" alt="Logo" class="h-12">
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block px-4 py-2.5 bg-blue-50 text-blue-700 rounded-lg font-medium">Data Pegawai</a>
            <a href="#" class="block px-4 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg font-medium">Pengaturan Dropdown</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- Header -->
        <header class="bg-white px-8 py-4 border-b border-gray-200 flex justify-between items-center sticky top-0 z-10 shadow-sm">
            <h1 class="text-xl font-bold text-gray-800">Form Pendaftaran Pegawai</h1>
            <div class="flex items-center gap-4">
                <span class="text-sm font-medium text-gray-600">Admin HRD</span>
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">A</div>
            </div>
        </header>

        <!-- Form Area -->
        <div class="p-8 max-w-7xl mx-auto w-full">
            <form id="formPegawai" class="space-y-8">
                
                <!-- SEKASI 1: Data Identitas Utama -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold text-blue-800 mb-4 border-b pb-2">1. Identitas Utama</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                            <input type="text" id="nama" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">NIK (KTP)</label>
                            <input type="text" id="nik" maxlength="16" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">NIP</label>
                            <input type="text" id="nip" maxlength="21" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none" placeholder="Isi untuk Auto TMT CPNS">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Status Pegawai</label>
                            <select id="status" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none bg-white">
                                <option value="Aktif">Aktif</option>
                                <option value="Mutasi">Mutasi</option>
                                <option value="Pensiun">Pensiun</option>
                                <option value="Resign">Resign</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Kelompok Pegawai</label>
                            <select id="kelompok_pegawai" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none bg-white">
                                <option value="ASN">ASN</option>
                                <option value="Konsultan">Konsultan</option>
                                <option value="APBD">APBD</option>
                                <option value="BLUD">BLUD</option>
                                <option value="Magang">Magang</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Role Sistem</label>
                            <select id="role" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none bg-white">
                                <option value="">-- Dimuat dari Pengaturan --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- SEKSI 2: Waktu & Otomatisasi (Highlight) -->
                <div class="bg-blue-50 p-6 rounded-xl shadow-sm border border-blue-100 relative overflow-hidden">
                    <div class="absolute top-0 right-0 bg-blue-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">Auto Calculate</div>
                    <h2 class="text-lg font-semibold text-blue-800 mb-4 border-b border-blue-200 pb-2">2. Riwayat Waktu & Otomatisasi</h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">TMT CPNS</label>
                            <input type="text" id="tmt_cpns" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Otomatis dari NIP">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Masuk RS</label>
                            <input type="date" id="masuk_rs" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Masa Kerja RS</label>
                            <input type="text" id="masa_kerja_rs" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Pilih Tgl Masuk RS terlebih dahulu">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Rentang BUP (Tahun)</label>
                            <input type="number" id="rentang_bup" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none" placeholder="Contoh: 58">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">TMT Pensiun</label>
                            <input type="text" id="tmt_pensiun" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Otomatis dari Lahir + BUP">
                        </div>
                    </div>
                </div>

                <!-- SEKSI 3: Detail Pribadi & Keluarga -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold text-blue-800 mb-4 border-b pb-2">3. Profil Pribadi & Keluarga</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tempat Lahir</label>
                            <input type="text" id="tempat_lahir" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir</label>
                            <input type="date" id="tanggal_lahir" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Kelamin</label>
                            <select id="jenis_kelamin" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none bg-white">
                                <option value="L">Laki-laki</option>
                                <option value="P">Perempuan</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Status Keluarga</label>
                            <select id="status_keluarga" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none bg-white">
                                <option value="Belum Kawin">Belum Kawin</option>
                                <option value="Kawin">Kawin</option>
                                <option value="Cerai Hidup">Cerai Hidup</option>
                                <option value="Cerai Mati">Cerai Mati</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pasangan</label>
                            <input type="text" id="nama_pasangan" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah Anak</label>
                            <select id="jumlah_anak" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none bg-white">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </div>
                        <!-- Field Anak Dinamis -->
                        <div id="div_anak1" class="hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Anak Ke-1</label>
                            <input type="text" id="anak1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none">
                        </div>
                        <div id="div_anak2" class="hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Anak Ke-2</label>
                            <input type="text" id="anak2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none">
                        </div>
                        <div id="div_anak3" class="hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Anak Ke-3</label>
                            <input type="text" id="anak3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Tombol Submit -->
                <div class="flex justify-end pt-4 pb-10 border-t border-gray-200">
                    <button type="button" class="mr-4 px-6 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium">Batal</button>
                    <button type="submit" class="px-6 py-2.5 bg-blue-700 text-white rounded-lg hover:bg-blue-800 shadow-md transition-colors font-medium">Simpan Data Pegawai</button>
                </div>
            </form>
        </div>
    </main>

    <!-- SCRIPT LOGIKA JS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Logika TMT CPNS (NIP -> TahunBulan-01)
            const nipInput = document.getElementById('nip');
            const tmtCpnsInput = document.getElementById('tmt_cpns');
            
            nipInput.addEventListener('input', (e) => {
                let cleanNip = e.target.value.replace(/[^0-9]/g, '');
                if (cleanNip.length >= 14) {
                    let tahun = cleanNip.substring(8, 12);
                    let bulan = cleanNip.substring(12, 14);
                    tmtCpnsInput.value = `${tahun}-${bulan}-01`;
                } else {
                    tmtCpnsInput.value = '';
                }
            });

            // 2. Logika TMT Pensiun (Tgl Lahir + BUP)
            const tglLahirInput = document.getElementById('tanggal_lahir');
            const bupInput = document.getElementById('rentang_bup');
            const tmtPensiunInput = document.getElementById('tmt_pensiun');

            const calculatePensiun = () => {
                if(tglLahirInput.value && bupInput.value) {
                    let date = new Date(tglLahirInput.value);
                    date.setFullYear(date.getFullYear() + parseInt(bupInput.value));
                    date.setMonth(date.getMonth() + 1); // Bulan depan
                    date.setDate(1); // Tanggal 1
                    tmtPensiunInput.value = date.toISOString().split('T')[0];
                }
            };
            tglLahirInput.addEventListener('change', calculatePensiun);
            bupInput.addEventListener('input', calculatePensiun);

            // 3. Logika Masa Kerja RS
            const masukRsInput = document.getElementById('masuk_rs');
            const masaKerjaInput = document.getElementById('masa_kerja_rs');

            masukRsInput.addEventListener('change', (e) => {
                if(!e.target.value) return;
                let awal = new Date(e.target.value);
                let sekarang = new Date();
                
                let years = sekarang.getFullYear() - awal.getFullYear();
                let months = sekarang.getMonth() - awal.getMonth();
                let days = sekarang.getDate() - awal.getDate();

                if (days < 0) {
                    months--;
                    let prevMonth = new Date(sekarang.getFullYear(), sekarang.getMonth(), 0);
                    days += prevMonth.getDate();
                }
                if (months < 0) {
                    years--;
                    months += 12;
                }
                masaKerjaInput.value = `${years} Tahun ${months} Bulan ${days} Hari`;
            });

            // 4. Logika Dropdown Jumlah Anak
            const jmlAnakInput = document.getElementById('jumlah_anak');
            jmlAnakInput.addEventListener('change', (e) => {
                let jml = parseInt(e.target.value);
                document.getElementById('div_anak1').classList.toggle('hidden', jml < 1);
                document.getElementById('div_anak2').classList.toggle('hidden', jml < 2);
                document.getElementById('div_anak3').classList.toggle('hidden', jml < 3);
            });
        });
    </script>
</body>
</html>
