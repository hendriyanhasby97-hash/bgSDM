<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SDM RSUD Drs. H. AMRI TAMBUNAN</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            /* Ganti 'background.jpg' dengan nama file gambarmu */
            background-image: url('assets/background.jpg'); 
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            width: 300px;
        }
        .logo {
            /* Ganti 'logo.png' dengan nama file logo RSUD */
            width: 100px;
            height: 100px;
            background-image: url('assets/logo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            margin: 0 auto 20px auto;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo"></div>
        <h2>Portal SDM</h2>
        <form id="loginForm">
            <input type="text" id="nikInput" placeholder="Masukkan NIK / NIP" required>
            <input type="password" id="passwordInput" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <script src="koneksi.js"></script>
    <script src="app.js"></script>
</body>
</html>
