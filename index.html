<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HRIS RSUD Drs. H. AMRI TAMBUNAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-login {
            background-image: url('HRIS.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-login h-screen flex items-center justify-center antialiased">
    
    <!-- Dark overlay for better readability -->
    <div class="absolute inset-0 bg-blue-900/40 mix-blend-multiply z-0"></div>

    <div class="glass-panel relative z-10 w-full max-w-md p-8 sm:p-10 rounded-2xl shadow-2xl">
        <div class="flex flex-col items-center mb-8">
            <img src="HRIS.png" alt="Logo HRIS" class="h-20 mb-4 drop-shadow-md">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Portal SDM</h1>
            <p class="text-sm text-gray-500 mt-1 text-center">RSUD Drs. H. AMRI TAMBUNAN</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Email</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-all shadow-sm outline-none placeholder-gray-400" placeholder="admin@rsud.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-all shadow-sm outline-none placeholder-gray-400" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full mt-2 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 focus:ring-4 focus:ring-blue-300">
                Masuk ke Sistem
            </button>
        </form>
        
        <div class="mt-6 text-center text-xs text-gray-500">
            &copy; 2026 RSUD Drs. H. AMRI TAMBUNAN.<br>All rights reserved.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
