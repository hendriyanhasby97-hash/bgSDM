<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HRIS RSUD Drs. H. AMRI TAMBUNAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-login {
            background-image: url('HRIS.png');
            background-size: cover;
            background-position: center;
        }
        .backdrop-blur { backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-login h-screen flex items-center justify-center">
    <div class="absolute inset-0 bg-white/60 backdrop-blur z-0"></div>
    
    <div class="relative z-10 bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <img src="HRIS.png" alt="Logo RSUD" class="h-24 mx-auto object-contain">
            <h2 class="text-xl font-bold text-gray-800 mt-4">Sistem Informasi SDM</h2>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-[#004b7c] hover:bg-blue-800 text-white font-bold py-2 px-4 rounded-md transition duration-200">
                Masuk
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
